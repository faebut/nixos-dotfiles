# md2pdf: Eisvogel report with colored title page, TOC and numbered sections
to: pdf
template: eisvogel
pdf-engine: pdflatex
filters:
  - ${.}/../filters/table-wrap.lua
number-sections: true
table-of-contents: true
toc-depth: 3
metadata:
  table-line-chars: 95
  table-code-weight: 1.19
variables:
  papersize: a4
  fontfamily: sourcesanspro
  fontfamilyoptions:
    - default
  titlepage: true
  titlepage-color: "1E3A5F"
  titlepage-text-color: "FFFFFF"
  titlepage-rule-color: "FFFFFF"
  titlepage-rule-height: 2
  toc-own-page: true
  colorlinks: true
  linkcolor: "blue"
  urlcolor: "blue"
  footnotes-pretty: true
