# md2pdf: Compact sans-serif notes, small margins, no title page
to: pdf
pdf-engine: pdflatex
filters:
  - ${.}/../filters/table-wrap.lua
metadata:
  table-line-chars: 114
  table-code-weight: 1.21
variables:
  documentclass: scrartcl
  classoption:
    - parskip=half
  papersize: a4
  fontsize: 10pt
  fontfamily: sourcesanspro
  fontfamilyoptions:
    - default
  geometry:
    - margin=1.8cm
  colorlinks: true
  linkcolor: "teal"
  urlcolor: "teal"
